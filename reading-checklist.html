<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>读书计划清单</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  background: #0d0d0d; color: #d0d0d0;
  min-height: 100vh; padding: 20px 16px 60px;
}
.header { text-align: center; padding: 16px 0 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 24px; }
.header h1 { font-size: 20px; color: #e8e8e8; margin-bottom: 6px; }
.header .sub { font-size: 11px; color: rgba(255,255,255,0.35); line-height: 1.6; }

.q { margin-bottom: 12px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); overflow: hidden; }
.qh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; user-select: none; }
.qh:hover { background: rgba(255,255,255,0.04); }
.qh .ar { font-size: 10px; color: rgba(255,255,255,0.2); transition: transform 0.2s; display: inline-block; }
.qh .ar.open { transform: rotate(90deg); }
.qh .em { font-size: 18px; }
.qh .qn { font-size: 14px; font-weight: 600; color: #e0e0e0; flex: 1; }
.qh .qd { font-size: 10px; color: rgba(255,255,255,0.3); }
.qh .qc { font-size: 11px; color: rgba(102,126,234,0.7); }

.qb { padding: 0 8px 8px; display: none; }
.qb.open { display: block; }

.bk { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
.bk:hover { background: rgba(255,255,255,0.05); }
.bk .cb { width: 16px; height: 16px; border-radius: 3px; border: 2px solid rgba(255,255,255,0.2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; transition: all 0.15s; }
.bk.checked .cb { background: #39d353; border-color: #39d353; color: #fff; }
.bk .inf { flex: 1; min-width: 0; }
.bk .t { font-size: 12.5px; color: #d8d8d8; line-height: 1.5; }
.bk.checked .t { color: rgba(255,255,255,0.3); text-decoration: line-through; }
.bk .au { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 2px; }

.ft { text-align: center; padding: 20px 0 10px; border-top: 1px solid rgba(255,255,255,0.08); }
.ft a { color: rgba(102,126,234,0.8); font-size: 12px; text-decoration: none; margin: 0 8px; }
</style>
</head>
<body>

<div class="header">
  <h1>📚 读书计划清单</h1>
  <div class="sub">基于肯·威尔伯四象限 · 在能力范围内扎实成长，不强行跃迁</div>
</div>

<!-- Q1 -->
<div class="q" id="q_Q1">
  <div class="qh" onclick="tg('q_Q1')">
    <span class="ar" id="ar_q_Q1">▶</span>
    <span class="em">🏆</span>
    <span class="qn">Q1（个人的外在）</span>
    <span class="qd">名、利、钱、美、成功、地位</span>
    <span class="qc" id="qc_q_Q1">0 / 36</span>
  </div>
  <div class="qb" id="qb_q_Q1"></div>
</div>

<!-- Q2 -->
<div class="q" id="q_Q2">
  <div class="qh" onclick="tg('q_Q2')">
    <span class="ar" id="ar_q_Q2">▶</span>
    <span class="em">🧘</span>
    <span class="qn">Q2（个人的内在）</span>
    <span class="qd">修行、悟道、心灵、内省、哲学</span>
    <span class="qc" id="qc_q_Q2">0 / 57</span>
  </div>
  <div class="qb" id="qb_q_Q2"></div>
</div>

<!-- Q3 -->
<div class="q" id="q_Q3">
  <div class="qh" onclick="tg('q_Q3')">
    <span class="ar" id="ar_q_Q3">▶</span>
    <span class="em">👥</span>
    <span class="qn">Q3（集体的内在）</span>
    <span class="qd">人伦关系、家庭、社会冲突、人情</span>
    <span class="qc" id="qc_q_Q3">0 / 20</span>
  </div>
  <div class="qb" id="qb_q_Q3"></div>
</div>

<!-- Q4 -->
<div class="q" id="q_Q4">
  <div class="qh" onclick="tg('q_Q4')">
    <span class="ar" id="ar_q_Q4">▶</span>
    <span class="em">🌏</span>
    <span class="qn">Q4（系统的外在）</span>
    <span class="qd">时代、历史、政治、经济、宏大叙事</span>
    <span class="qc" id="qc_q_Q4">0 / 67</span>
  </div>
  <div class="qb" id="qb_q_Q4"></div>
</div>

<div class="ft">
  <a href="index.html">← 每日划线</a>
  <a href="reading-heatmap.html">📊 阅读热力图</a>
</div>

<script>
// Book data (generated by Python)
const BOOKS = {
  "Q1": [
    {"t": "我胆小如鼠", "a": "余华"},
    {"t": "一个深圳年轻人和她的39份兼职", "a": "《人物》杂志"},
    {"t": "投喂AI", "a": "詹姆斯·马尔登等"},
    {"t": "记忆心理学", "a": "杨治良等"},
    {"t": "你也走了很远的路吧", "a": "卢思浩"},
    {"t": "关你屁事 关我屁事", "a": "冯唐"},
    {"t": "不要等到毕业以后", "a": "秋叶"},
    {"t": "宇宙工程师之歌", "a": "刘慈欣"},
    {"t": "理工男谈理财", "a": "王晆"},
    {"t": "聪明的投资者", "a": "本杰明·格雷厄姆"}
  ],
  "Q2": [
    {"t": "当钻牛角尖遇到四象限", "a": "梁爽"},
    {"t": "大学该怎么读", "a": "南振中"},
    {"t": "自学大全", "a": "读书猴"},
    {"t": "自在", "a": "李筱懿"},
    {"t": "人生拒绝清单", "a": "pha"},
    {"t": "黑塞书信集", "a": "赫尔曼·黑塞"},
    {"t": "怕，就会输一辈子", "a": "奥里森·马登"},
    {"t": "二十几岁，没有十年", "a": "孙晴悦"},
    {"t": "极简生活", "a": "极简丹"},
    {"t": "毛泽东传", "a": "中共中央文献研究室"}
  ],
  "Q3": [
    {"t": "一个人的勇气", "a": "有川真由美"},
    {"t": "道德经", "a": "老子"},
    {"t": "Blue", "a": "叶真中显"},
    {"t": "我的职业是小说家", "a": "村上春树"},
    {"t": "会做图表的人显得特别牛", "a": "桐山岳宽"},
    {"t": "打工人避坑指南", "a": "刘婷"},
    {"t": "愿你的青春不负梦想", "a": "俞敏洪"},
    {"t": "刘慈欣中短篇科幻小说合集", "a": "刘慈欣"},
    {"t": "柏杨白话版资治通鉴", "a": "柏杨"},
    {"t": "围城", "a": "钱钟书"}
  ],
  "Q4": [
    {"t": "迟到的成年", "a": "大吕"},
    {"t": "我们今天的现实就是超现实", "a": "余华"},
    {"t": "我的第一本人生规划手册", "a": "柏永辉"},
    {"t": "浙江宣传", "a": "公众号"},
    {"t": "一个人的朝圣", "a": "蕾秋·乔伊斯"},
    {"t": "牛津通识读本：免疫系统", "a": "保罗·克莱纳曼"},
    {"t": "中国哲学简史", "a": "冯友兰"},
    {"t": "马克思主义经典原著选读", "a": "郑祥福"},
    {"t": "我比世界晚熟", "a": "胡安焉"},
    {"t": "思考的整理学", "a": "外山滋比古"}
  ]
};

const K = 'weread_checklist_v1';

function load() {
  try { return JSON.parse(localStorage.getItem(K)) || {}; } catch(e) { return {}; }
}
function save(s) { localStorage.setItem(K, JSON.stringify(s)); }

function tg(id) {
  const qb = document.getElementById('qb_' + id);
  const ar = document.getElementById('ar_' + id);
  qb.classList.toggle('open');
  ar.classList.toggle('open');
}

function ck(el, q, i) {
  el.classList.toggle('checked');
  const state = load();
  state[q + '_' + i] = el.classList.contains('checked');
  save(state);
  upd(q);
}

function upd(q) {
  const items = document.querySelectorAll('#qb_' + q + ' .bk');
  let done = 0;
  items.forEach(it => { if (it.classList.contains('checked')) done++; });
  const total = items.length;
  const el = document.getElementById('qc_' + q);
  if (el) el.textContent = done + ' / ' + total;
}

function init() {
  // Render books
  for (const [q, books] of Object.entries(BOOKS)) {
    const qb = document.getElementById('qb_' + q);
    if (!qb) continue;
    let html = '';
    books.forEach((b, i) => {
      html += '<div class="bk" id="' + q + '_' + i + '" onclick="ck(this,\\'' + q + '\\',' + i + ')">' +
        '<div class="cb">✓</div>' +
        '<div class="inf">' +
          '<div class="t">' + b.t + '</div>' +
          '<div class="au">' + b.a + '</div>' +
        '</div></div>';
    });
    qb.innerHTML = html;
  }

  // Restore state
  const state = load();
  for (const [key, checked] of Object.entries(state)) {
    if (!checked) continue;
    const el = document.getElementById(key);
    if (el) el.classList.add('checked');
  }

  // Update all counts
  for (const q of Object.keys(BOOKS)) upd(q);

  // Auto-expand all on first visit
  const visited = localStorage.getItem('weread_checklist_v1_visited');
  if (!visited) {
    for (const q of Object.keys(BOOKS)) tg(q);
    localStorage.setItem('weread_checklist_v1_visited', '1');
  }
}

init();
</script>
</body>
</html>
